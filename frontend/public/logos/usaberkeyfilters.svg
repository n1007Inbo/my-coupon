<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130">
  <defs>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left: Iconic Water Drop Emblem -->
  <g transform="translate(10, 8)">
    <!-- Main Drop -->
    <path d="M 52,4 C 52,4 10,64 10,88 A 42,42 0 0,0 94,88 C 94,64 52,4 52,4 Z" fill="url(#dropGrad)" filter="url(#shadow)" />
    
    <!-- Stylized Water Ripple Waves inside drop -->
    <path d="M 22,86 C 34,74 46,92 60,82 C 72,72 82,80 88,86 C 84,106 66,118 52,118 C 38,118 24,104 22,86 Z" fill="url(#waveGrad)" opacity="0.3" />
    
    <!-- Distinct American / Purity Wave Accent -->
    <path d="M 28,78 C 40,68 50,84 64,76 C 74,70 82,76 86,80 C 82,68 70,58 52,58 C 42,58 32,68 28,78 Z" fill="#ffffff" opacity="0.85" />
    <path d="M 32,92 C 44,84 54,96 66,90 C 74,86 80,90 84,94 C 78,106 66,114 52,114 C 42,114 34,106 32,92 Z" fill="#ef4444" opacity="0.75" />
  </g>

  <!-- Right: Bold, Crystal-Clear Typography -->
  <g transform="translate(120, 0)">
    <!-- Top Line: USA BERKEY -->
    <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" fill="#0f172a" letter-spacing="0.5">
      USA BERKEY
    </text>

    <!-- Bottom Line: WATER FILTERS -->
    <text x="2" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="800" fill="#0284c7" letter-spacing="4">
      WATER FILTERS
    </text>

    <!-- Subtitle: OFFICIAL PURIFICATION SYSTEMS -->
    <text x="2" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2">
      OFFICIAL PURIFICATION SYSTEMS
    </text>
  </g>
</svg>