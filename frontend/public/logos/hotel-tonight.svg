<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="htGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E0D33" />
      <stop offset="100%" stop-color="#38061C" />
    </linearGradient>
  </defs>
  <!-- Brand Plum/Burgundy Background -->
  <rect width="100%" height="100%" rx="12" fill="url(#htGrad)" />
  
  <!-- Stylized Bed Logo (Matching user image exactly) -->
  <g transform="translate(25, 18)" fill="#ffffff">
    <!-- Headboard (Left vertical bar) -->
    <rect x="0" y="0" width="8" height="44" rx="1.5" />
    <!-- Bed Frame / Mattress (Horizontal bar) -->
    <rect x="8" y="18" width="44" height="8" rx="1.5" />
    <!-- Footboard Leg (Right vertical bar) -->
    <rect x="44" y="26" width="8" height="18" rx="1.5" />
  </g>

  <!-- Text -->
  <text x="95" y="49" font-family="'Outfit', 'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.5">
    HotelTonight
  </text>
</svg>
