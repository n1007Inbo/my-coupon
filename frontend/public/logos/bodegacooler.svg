<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="bodegaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <!-- Cooler Box Icon -->
  <g transform="translate(10, 12)">
    <!-- Handle -->
    <path d="M 22 15 C 22 8, 44 8, 44 15" fill="none" stroke="#15803d" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Lid -->
    <rect x="10" y="16" width="46" height="10" rx="3" fill="#16a34a"/>
    <!-- Body -->
    <rect x="12" y="27" width="42" height="34" rx="4" fill="url(#bodegaGreen)"/>
    <!-- Latch / Accent -->
    <rect x="28" y="24" width="10" height="8" rx="2" fill="#0f172a"/>
    <!-- Snowflake / Cold detail -->
    <path d="M 33 37 L 33 51 M 26 44 L 40 44 M 28 39 L 38 49 M 28 49 L 38 39" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Typography: BODEGA COOLER -->
  <text x="82" y="50" font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="2" fill="#0f172a">BODEGA</text>
  <text x="84" y="68" font-family="'Outfit', 'Montserrat', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="6" fill="#16a34a">COOLER</text>
</svg>