<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Background glowing gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    
    <!-- Standing desk glowing electric blue gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Clean rounded background with border -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  
  <!-- Abstract modern premium Desktronic 'D' & Standing Desk concept icon -->
  <g transform="translate(10, 5)">
    <!-- Electric glow underneath -->
    <path d="M30 45 L70 45 M35 45 L35 75 M65 45 L65 75" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" opacity="0.3" filter="url(#glow)" />
    
    <!-- Motorized Dual columns (Legs) -->
    <line x1="42" y1="48" x2="42" y2="78" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    <line x1="58" y1="48" x2="58" y2="78" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" />
    
    <!-- Telescopic column joints (Sleek tech details) -->
    <rect x="39" y="55" width="6" height="3" rx="0.5" fill="#cbd5e1" />
    <rect x="55" y="55" width="6" height="3" rx="0.5" fill="#cbd5e1" />
    <rect x="39" y="66" width="6" height="3" rx="0.5" fill="#64748b" />
    <rect x="55" y="66" width="6" height="3" rx="0.5" fill="#64748b" />

    <!-- Solid steel feet -->
    <path d="M30 78 h24" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
    <path d="M46 78 h24" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Motorized adjustment control panel (glowing dot) -->
    <circle cx="68" cy="48" r="2" fill="#38bdf8" filter="url(#glow)" />

    <!-- Ergonomic beveled desk surface (Electric blue glow) -->
    <rect x="22" y="38" width="56" height="6.5" rx="2" fill="url(#brandGrad)" filter="url(#glow)" />
    <rect x="22" y="38" width="56" height="6.5" rx="2" fill="url(#brandGrad)" />
    
    <!-- Modern Height Adjustment Up/Down Sleek Arrows -->
    <path d="M50 48 L50 68" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <polyline points="47 52 50 49 53 52" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="47 64 50 67 53 64" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- Minimalist subtle brand typography name at bottom -->
  <text x="50%" y="102" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="9" fill="#f8fafc" letter-spacing="1.5">DESKTRONIC</text>
</svg>
