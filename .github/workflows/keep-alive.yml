name: Keep Alive Render Backend

on:
  schedule:
    # Run every 14 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          # Use the RENDER_BACKEND_URL repository secret if configured, otherwise fallback
          URL="${{ secrets.RENDER_BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "RENDER_BACKEND_URL secret is not configured. Please add RENDER_BACKEND_URL to your GitHub Secrets."
            exit 1
          fi
          echo "Pinging backend at $URL..."
          curl -sS --fail "$URL" || echo "Ping failed, but server might be booting up."
